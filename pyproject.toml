[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvflow"
version = "0.1.0"
description = "KVFlow - a universal agent development workflow: durable planning, dispatching, implementation, review and integration for any registered project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.30,<2",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kvflow = "kvflow.cli:main"
kvflow-mcp = "kvflow.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: no global addopts. KVFlow builds its own canned argv for the profiles it
# runs inside a task workspace, and a second configured addopts would silently
# change the receipt a profile produces.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:kvflow.*"]
